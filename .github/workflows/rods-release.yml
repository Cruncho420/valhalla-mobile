# Rods fork release workflow.
#
# Derived from release.yml at tag 0.5.1 with these deliberate changes:
#   - Trigger: manual workflow_dispatch with an explicit tag_name input
#     (no version_bump.sh / Package.swift rewrite / auto-commit machinery).
#   - Android: stops at :valhalla:assembleRelease and publishes the AAR as a
#     GitHub Release asset. ALL Maven Central / Sonatype / signing publish
#     steps are removed (this fork has no publishing credentials and must
#     never attempt to publish).
#   - iOS: identical build + xcframework packaging steps; the zip becomes a
#     GitHub Release asset instead of feeding the SPM Package.swift rewrite.
#   - Both artifacts get .sha256 checksum companion assets.
#   - Release is created draft=false, prerelease=true via the same
#     softprops/action-gh-release action upstream uses.

name: Rods Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        type: boolean
        description: "Publish a GitHub release after building (false keeps workflow artifacts only)"
        required: true
        default: true
      tag_name:
        type: string
        description: "Tag to create the release under"
        required: true
        default: "rods-0.5.1-k21"

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      matrix:
        arch: ["arm64-ios", "arm64-ios-simulator", "x64-ios-simulator"]

    steps:
      - name: Checkout Valhalla
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4.0"

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg && git -C vcpkg checkout 2025.10.17
          ./vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=`pwd`/vcpkg

      - name: Build for iOS & iOS Simulator
        run: ./build.sh --ios ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            build/apple/${{ matrix.arch }}/install

  create-xcframework:
    needs: build-ios
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout Valhalla
        uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4.0"

      - name: Download iOS build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/apple
          pattern: "*ios*"

      - name: Move artifacts to correct locations
        run: |
          for arch in arm64-ios arm64-ios-simulator x64-ios-simulator; do
            mkdir -p build/apple/$arch/install
            mv build/apple/$arch/* build/apple/$arch/install/ || true
          done

      - name: Create XCFramework
        run: |
          ./scripts/create_xcframework.sh

      - name: Zip the xcframework
        run: |
          cd build/apple
          zip -r valhalla-wrapper.xcframework.zip valhalla-wrapper.xcframework
          mv valhalla-wrapper.xcframework.zip ../../
          cd ../../

      - name: Upload xcframework zip output
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-wrapper.xcframework.zip
          path: |
            valhalla-wrapper.xcframework.zip

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        arch: ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]

    steps:
      - name: Checkout Valhalla
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg && git -C vcpkg checkout 2024.09.23
          ./vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=`pwd`/vcpkg

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew buildValhallaFor-${{ matrix.arch }}
        working-directory: android

      - name: Upload JNI Lib
        uses: actions/upload-artifact@v4
        with:
          name: libvalhalla-${{ matrix.arch }}
          path: android/valhalla/src/main/jniLibs/${{ matrix.arch }}/libvalhalla-wrapper.so
          retention-days: 1

  combine-android:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download JNI lib artifacts
        uses: actions/download-artifact@v4
        with:
          path: jniLibs
          pattern: "libvalhalla-*"

      - name: Organize and zip artifacts
        run: |
          mkdir -p android/valhalla/src/main/jniLibs
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p android/valhalla/src/main/jniLibs/$arch
            if [ -f jniLibs/libvalhalla-$arch/libvalhalla-wrapper.so ]; then
              cp jniLibs/libvalhalla-$arch/libvalhalla-wrapper.so android/valhalla/src/main/jniLibs/$arch/
            fi
          done
          zip -r valhalla-jniLibs.zip android

      - name: Upload zipped JNI Libs
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-jniLibs
          path: valhalla-jniLibs.zip
          retention-days: 1

  # Mirrors upstream's publish-android job setup, but checks out the
  # dispatched ref (not main), stops at assembleRelease, and never touches
  # Maven Central. The combined jniLibs are unzipped into the source tree
  # first, so the buildValhallaFor-* preBuild hooks are skipped via their
  # onlyIf { !jniLibs/<arch>/libvalhalla-wrapper.so } guards.
  build-aar:
    needs: combine-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: cat version.txt

      - name: Download JNI Libs
        uses: actions/download-artifact@v4
        with:
          name: valhalla-jniLibs
          path: .

      - name: Unzip JNI Libs
        run: unzip -o valhalla-jniLibs.zip

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      # Evidence for consumers: prove KGP 2.1.20 is on the build classpath.
      - name: Log Kotlin Gradle plugin version
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew -q buildEnvironment | grep -i "kotlin" || true
        working-directory: android

      - name: Build release AAR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew :valhalla:assembleRelease
        working-directory: android

      - name: Verify jniLibs made it into the AAR and rename
        run: |
          ls -la android/valhalla/build/outputs/aar/
          AAR=$(ls android/valhalla/build/outputs/aar/*-release.aar | head -1)
          unzip -l "$AAR" | grep -E "jni/.*/libvalhalla-wrapper.so" || (echo "ERROR: jniLibs missing from AAR" && exit 1)
          unzip -l "$AAR" | grep -c "jni/.*/libvalhalla-wrapper.so"
          cp "$AAR" "valhalla-mobile-${{ inputs.tag_name }}.aar"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-aar
          path: valhalla-mobile-*.aar

  test-ios-trace:
    if: ${{ !inputs.publish_release }}
    needs: create-xcframework
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VALHALLA_MOBILE_DEV: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4.0"
      - uses: actions/download-artifact@v4
        with:
          name: valhalla-wrapper.xcframework.zip
          path: native-input
      - name: Bind tests to this run's native framework
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p build/apple test-evidence/ios
          shasum -a 256 native-input/valhalla-wrapper.xcframework.zip > test-evidence/ios/artifact.sha256
          unzip -q native-input/valhalla-wrapper.xcframework.zip -d build/apple
          test -f build/apple/valhalla-wrapper.xcframework/Info.plist
          swift package dump-package > test-evidence/ios/package.json
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          evidence = pathlib.Path("test-evidence/ios")
          manifest = json.loads((evidence / "package.json").read_text())
          targets = [t for t in manifest["targets"] if t["name"] == "ValhallaWrapper"]
          assert len(targets) == 1, "Native binary target missing or ambiguous"
          target = targets[0]
          assert target["type"] == "binary"
          assert target.get("path") == "build/apple/valhalla-wrapper.xcframework", target
          assert not target.get("url"), "Published native binary must never satisfy these tests"
          (evidence / "source-sha.txt").write_text(os.environ["GITHUB_SHA"] + "\n")
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          phones = [d for runtime, values in devices["devices"].items() if "iOS-18" in runtime
                    for d in values if d["name"].startswith("iPhone") and d["isAvailable"]]
          assert phones, "Xcode 16.4 needs an available iOS 18 iPhone simulator"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("TRACE_SIMULATOR_ID=" + phones[0]["udid"] + "\n")
          PY
          shasum -a 256 apple/Tests/ValhallaTests/TestTraceRoute.swift > test-evidence/ios/test-source.sha256
      - name: Run native trace XCTest
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -scheme ValhallaMobile -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$TRACE_SIMULATOR_ID" \
            -only-testing:ValhallaTests/TestTraceRoute \
            -parallel-testing-enabled NO \
            -resultBundlePath test-evidence/ios/TraceTests.xcresult \
            -skipPackagePluginValidation \
            | tee test-evidence/ios/xcodebuild.log
          xcrun xcresulttool get test-results tests \
            --path test-evidence/ios/TraceTests.xcresult > test-evidence/ios/tests.json
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path("test-evidence/ios/tests.json").read_text())
          def flatten(nodes):
              for node in nodes:
                  yield node
                  yield from flatten(node.get("children", []))
          tests = [n for n in flatten(result["testNodes"])
                   if n.get("name") == "testTraceUsesMapMatchingAndActorSurvivesErrors()"]
          assert tests, "Expected native trace XCTest did not execute"
          assert all(t.get("result") == "Passed" for t in tests), tests
          PY
      - name: Upload native XCTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-trace-test-evidence
          path: test-evidence/ios

  test-android-trace:
    if: ${{ !inputs.publish_release }}
    needs: build-aar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false
      - uses: actions/download-artifact@v4
        with:
          name: valhalla-aar
          path: native-input
      - name: Bind tests to this run's packaged JNI libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          aars = list(pathlib.Path("native-input").glob("*.aar"))
          assert len(aars) == 1, "Expected exactly this run's AAR"
          receipt = {"source_sha": os.environ["GITHUB_SHA"], "aar_sha256": hashlib.sha256(aars[0].read_bytes()).hexdigest(), "jni_sha256": {}}
          with zipfile.ZipFile(aars[0]) as aar:
              for arch in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86"):
                  data = aar.read(f"jni/{arch}/libvalhalla-wrapper.so")
                  assert data.startswith(b"\x7fELF"), arch
                  assert b"Java_com_valhalla_valhalla_ValhallaRaw_nativeTraceRoute\x00" in data, arch
                  assert b"Java_com_valhalla_valhalla_ValhallaRaw_nativeTraceAttributes\x00" in data, arch
                  output = pathlib.Path(f"android/valhalla/src/main/jniLibs/{arch}/libvalhalla-wrapper.so")
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(data)
                  receipt["jni_sha256"][arch] = hashlib.sha256(data).hexdigest()
          source = pathlib.Path("android/valhalla/src/androidTest/java/com/valhalla/valhalla/ValhallaRawTraceRouteTest.kt")
          receipt["test_source_sha256"] = hashlib.sha256(source.read_bytes()).hexdigest()
          evidence = pathlib.Path("test-evidence/android")
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "native-input.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native trace instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew :valhalla:connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.valhalla.valhalla.ValhallaRawTraceRouteTest
      - name: Require both native trace tests to have passed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path("android/valhalla/build/outputs/androidTest-results/connected").rglob("*.xml"))
          assert files, "No instrumentation result XML"
          expected = {"traceUsesMapMatchingAndActorSurvivesErrors", "closeIsIdempotentAndRejectsBothActions"}
          passed = set()
          for path in files:
              for test in ET.parse(path).iter("testcase"):
                  if test.get("classname") == "com.valhalla.valhalla.ValhallaRawTraceRouteTest":
                      assert not any(test.find(tag) is not None for tag in ("failure", "error", "skipped")), ET.tostring(test)
                      passed.add(test.get("name"))
          assert expected <= passed, ("Expected native tests did not execute", expected - passed)
          PY
      - name: Upload native instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-trace-test-evidence
          path: |
            test-evidence/android
            android/valhalla/build/outputs/androidTest-results/connected
            android/valhalla/build/reports/androidTests/connected

  release:
    if: ${{ inputs.publish_release }}
    needs: [create-xcframework, build-aar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download xcframework
        uses: actions/download-artifact@v4
        with:
          name: valhalla-wrapper.xcframework.zip
          path: assets

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: valhalla-aar
          path: assets

      - name: Generate SHA-256 checksums
        run: |
          cd assets
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la
          cat *.sha256

      - uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          tag_name: ${{ inputs.tag_name }}
          generate_release_notes: false
          body: |
            Rods rebuild of valhalla-mobile 0.5.1.

            - Android AAR compiled with Kotlin 2.1.20 (upstream 0.5.1 used 2.3.0),
              so its Kotlin metadata is readable by Kotlin 2.0.x consumers
              (Expo 54 / React Native 0.81).
            - Model dependencies pinned to io.github.rallista:valhalla-models(-config)
              0.0.9 (upstream pinned 0.1.1, which is Kotlin-2.3.0-built and equally
              unreadable by Kotlin <2.3). AAR consumers must add valhalla-models and
              valhalla-models-config 0.0.9 (plus osrm-openapi 0.0.10, moshi 1.15.1)
              to their own dependencies - the AAR does not bundle them.
            - iOS xcframework built with upstream's unchanged pipeline.
            - Valhalla engine submodule UNCHANGED at the 0.5.1 pin (e2f017b).
            - Binaries are consumed directly as release assets; nothing is
              published to Maven Central from this fork.

            Verify downloads against the .sha256 companion assets.
          files: assets/*
