# Rods fork release workflow.
#
# Derived from release.yml at tag 0.5.1 with these deliberate changes:
#   - Trigger: manual workflow_dispatch with an explicit tag_name input
#     (no version_bump.sh / Package.swift rewrite / auto-commit machinery).
#   - Android: stops at :valhalla:assembleRelease and publishes the AAR as a
#     GitHub Release asset. ALL Maven Central / Sonatype / signing publish
#     steps are removed (this fork has no publishing credentials and must
#     never attempt to publish).
#   - iOS: identical build + xcframework packaging steps; the zip becomes a
#     GitHub Release asset instead of feeding the SPM Package.swift rewrite.
#   - Both artifacts get .sha256 checksum companion assets.
#   - Release is created draft=false, prerelease=true via the same
#     softprops/action-gh-release action upstream uses.

name: Rods Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        type: boolean
        description: "Publish a GitHub release after building (false keeps workflow artifacts only)"
        required: true
        default: true
      tag_name:
        type: string
        description: "Tag to create the release under"
        required: true
        default: "rods-0.5.1-k21"

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      matrix:
        arch: ["arm64-ios", "arm64-ios-simulator", "x64-ios-simulator"]

    steps:
      - name: Checkout Valhalla
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4.0"

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg && git -C vcpkg checkout 2025.10.17
          ./vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=`pwd`/vcpkg

      - name: Build for iOS & iOS Simulator
        run: ./build.sh --ios ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            build/apple/${{ matrix.arch }}/install

  create-xcframework:
    needs: build-ios
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout Valhalla
        uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4.0"

      - name: Download iOS build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/apple
          pattern: "*ios*"

      - name: Move artifacts to correct locations
        run: |
          for arch in arm64-ios arm64-ios-simulator x64-ios-simulator; do
            mkdir -p build/apple/$arch/install
            mv build/apple/$arch/* build/apple/$arch/install/ || true
          done

      - name: Create XCFramework
        run: |
          ./scripts/create_xcframework.sh

      - name: Zip the xcframework
        run: |
          cd build/apple
          zip -r valhalla-wrapper.xcframework.zip valhalla-wrapper.xcframework
          mv valhalla-wrapper.xcframework.zip ../../
          cd ../../

      - name: Upload xcframework zip output
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-wrapper.xcframework.zip
          path: |
            valhalla-wrapper.xcframework.zip

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        arch: ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]

    steps:
      - name: Checkout Valhalla
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg && git -C vcpkg checkout 2024.09.23
          ./vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=`pwd`/vcpkg

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew buildValhallaFor-${{ matrix.arch }}
        working-directory: android

      - name: Upload JNI Lib
        uses: actions/upload-artifact@v4
        with:
          name: libvalhalla-${{ matrix.arch }}
          path: android/valhalla/src/main/jniLibs/${{ matrix.arch }}/libvalhalla-wrapper.so
          retention-days: 1

  combine-android:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download JNI lib artifacts
        uses: actions/download-artifact@v4
        with:
          path: jniLibs
          pattern: "libvalhalla-*"

      - name: Organize and zip artifacts
        run: |
          mkdir -p android/valhalla/src/main/jniLibs
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p android/valhalla/src/main/jniLibs/$arch
            if [ -f jniLibs/libvalhalla-$arch/libvalhalla-wrapper.so ]; then
              cp jniLibs/libvalhalla-$arch/libvalhalla-wrapper.so android/valhalla/src/main/jniLibs/$arch/
            fi
          done
          zip -r valhalla-jniLibs.zip android

      - name: Upload zipped JNI Libs
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-jniLibs
          path: valhalla-jniLibs.zip
          retention-days: 1

  # Mirrors upstream's publish-android job setup, but checks out the
  # dispatched ref (not main), stops at assembleRelease, and never touches
  # Maven Central. The combined jniLibs are unzipped into the source tree
  # first, so the buildValhallaFor-* preBuild hooks are skipped via their
  # onlyIf { !jniLibs/<arch>/libvalhalla-wrapper.so } guards.
  build-aar:
    needs: combine-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: cat version.txt

      - name: Download JNI Libs
        uses: actions/download-artifact@v4
        with:
          name: valhalla-jniLibs
          path: .

      - name: Unzip JNI Libs
        run: unzip -o valhalla-jniLibs.zip

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      # Evidence for consumers: prove KGP 2.1.20 is on the build classpath.
      - name: Log Kotlin Gradle plugin version
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew -q buildEnvironment | grep -i "kotlin" || true
        working-directory: android

      - name: Build release AAR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew :valhalla:assembleRelease
        working-directory: android

      - name: Verify jniLibs made it into the AAR and rename
        run: |
          ls -la android/valhalla/build/outputs/aar/
          AAR=$(ls android/valhalla/build/outputs/aar/*-release.aar | head -1)
          unzip -l "$AAR" | grep -E "jni/.*/libvalhalla-wrapper.so" || (echo "ERROR: jniLibs missing from AAR" && exit 1)
          unzip -l "$AAR" | grep -c "jni/.*/libvalhalla-wrapper.so"
          cp "$AAR" "valhalla-mobile-${{ inputs.tag_name }}.aar"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-aar
          path: valhalla-mobile-*.aar

  release:
    if: ${{ inputs.publish_release }}
    needs: [create-xcframework, build-aar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download xcframework
        uses: actions/download-artifact@v4
        with:
          name: valhalla-wrapper.xcframework.zip
          path: assets

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: valhalla-aar
          path: assets

      - name: Generate SHA-256 checksums
        run: |
          cd assets
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la
          cat *.sha256

      - uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          tag_name: ${{ inputs.tag_name }}
          generate_release_notes: false
          body: |
            Rods rebuild of valhalla-mobile 0.5.1.

            - Android AAR compiled with Kotlin 2.1.20 (upstream 0.5.1 used 2.3.0),
              so its Kotlin metadata is readable by Kotlin 2.0.x consumers
              (Expo 54 / React Native 0.81).
            - Model dependencies pinned to io.github.rallista:valhalla-models(-config)
              0.0.9 (upstream pinned 0.1.1, which is Kotlin-2.3.0-built and equally
              unreadable by Kotlin <2.3). AAR consumers must add valhalla-models and
              valhalla-models-config 0.0.9 (plus osrm-openapi 0.0.10, moshi 1.15.1)
              to their own dependencies - the AAR does not bundle them.
            - iOS xcframework built with upstream's unchanged pipeline.
            - Valhalla engine submodule UNCHANGED at the 0.5.1 pin (e2f017b).
            - Binaries are consumed directly as release assets; nothing is
              published to Maven Central from this fork.

            Verify downloads against the .sha256 companion assets.
          files: assets/*
